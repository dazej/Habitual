spring.application.name=Habitual
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/habitual
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Demo data: 4 sample users with habits and completions, added at startup only when the users table is empty.
# Set to false to start with empty tables.
habitual.seed.demo-data=true
